<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" font-family="'Cascadia Code', Consolas, monospace">
  <title>AutoPlayQA CLI 演示</title>
  <defs>
    <clipPath id="winClip">
      <rect x="0" y="0" width="720" height="348" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#winClip)">
    <rect x="0" y="0" width="720" height="348" fill="#1e1e2e"/>
    <rect x="0" y="0" width="720" height="40" fill="#181825"/>
    <line x1="0" y1="40" x2="720" y2="40" stroke="#313244" stroke-width="1"/>

    <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="20" r="6" fill="#27c93f"/>

    <text x="360" y="25" text-anchor="middle" font-size="13" fill="#a6adc8">AutoPlayQA CLI</text>

    <g font-size="14" fill="#cdd6f4" xml:space="preserve">
      <text x="24" y="84"><tspan fill="#4ade80">&gt; </tspan><tspan>python main.py</tspan></text>

      <text x="24" y="112">AutoPlayQA 启动，发现 1 台设备（EXAMPLE_SERIAL）</text>

      <text x="24" y="140"><tspan fill="#4ade80">&gt; </tspan><tspan>task run open_settings</tspan></text>

      <text x="24" y="168"><tspan>[1/3] 设置主页   ui_text「设置」   </tspan><tspan fill="#4ade80">✓</tspan><tspan> 识别命中 → click</tspan></text>

      <text x="24" y="196"><tspan>[2/3] 显示设置   ui_text「显示」   </tspan><tspan fill="#4ade80">✓</tspan><tspan> 识别命中 → click</tspan></text>

      <text x="24" y="224"><tspan>[3/3] 亮度调节   ocr「亮度」      </tspan><tspan fill="#4ade80">✓</tspan><tspan> 识别命中 → drag</tspan></text>

      <text x="24" y="252" fill="#facc15">⚠ watchdog 命中「网络错误」→ 记 finding · 截图留证 · 跳恢复节点</text>

      <text x="24" y="280">任务完成：3 步 · 1 条 finding（任务成功也照报）</text>

      <text x="24" y="308" fill="#67e8f9">报告: outputs/findings/20260818/EXAMPLE_SERIAL/.../report.html</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="719" height="347" rx="12" ry="12" fill="none" stroke="#313244" stroke-width="1"/>
</svg>
